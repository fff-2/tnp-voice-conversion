name: voice
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - pip
  - portaudio
  - ffmpeg
  - pip:
      # Install PyTorch separately after activating the env:
      # pip3 install torch torchvision --index-url https://download.pytorch.org/whl/cu128
      - deepfilternet>=0.6.0
      - torchcrepe
      - fastapi>=0.110
      - "uvicorn[standard]"
      - websockets>=12.0
      - librosa>=0.10
      - soundfile
      - sounddevice
      - numpy>=2.0
      - scipy
      - tqdm
      - loguru
      - requests
      - python-multipart
      # Windows client only — install manually on Windows:
      # pip install pipwin && pipwin install pyaudio
